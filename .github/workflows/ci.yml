name: CI for CreateCustomer 🚀

# Configuración para que solo se ejecute en la rama test
on:
  push:
    branches:
      - test

# Configuración de los jobs
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 🛠️ Paso 1: Checkout del código
    - name: Checkout code 📦
      uses: actions/checkout@v3

    # ⚙️ Paso 2: Configurar Docker
    - name: Set up Docker Buildx 🐳
      uses: docker/setup-buildx-action@v2

    # 🔑 Paso 3: Login a Docker Hub
    - name: Login to Docker Hub 🔐
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # 🏗️ Paso 4: Construir la imagen Docker
    - name: Build Docker image 🔨
      run: |
        docker build -t erickuce/projectawsstore-createcustomer:latest .

    # 📤 Paso 5: Subir la imagen a Docker Hub
    - name: Push Docker image to Docker Hub 🌍
      run: |
        docker push erickuce/projectawsstore-createcustomer:latest

    # 🚀 Paso 6: Desplegar en EC2 (Opcional)
    - name: Deploy to EC2 (Optional) 🌐
      env:
        PRIVATE_KEY: ${{ secrets.EC2_PRIVATE_KEY }}
        HOST: ${{ secrets.EC2_HOST }}  # El host es de CreateCustomer
        USER: ${{ secrets.EC2_USER }}  # El usuario es EC2, por ejemplo 'ubuntu'
      run: |
        # Guardar la clave privada en un archivo temporal
        echo "$PRIVATE_KEY" > private_key.pem
        chmod 600 private_key.pem
        # Conexión SSH a la instancia EC2 y despliegue del contenedor
        ssh -i private_key.pem $USER@$HOST << 'EOF'
          docker pull erickuce/projectawsstore-createcustomer:latest
          docker run -d -p 8081:8081 erickuce/projectawsstore-createcustomer:latest
        EOF
